name: Build PokeBonk Windows EXE

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Fast Portable EXE
        working-directory: ./windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm run dist

      - name: Generate Auto-Updater Manifest (latest.yml)
        working-directory: ./windows
        shell: pwsh
        run: |
          $exePath = "dist/PokeBonk.exe"
          if (Test-Path $exePath) {
            $size = (Get-Item $exePath).Length
            $hash = (Get-FileHash $exePath -Algorithm SHA512).Hash
            $hashBytes = [byte[]] -split ($hash -replace '..', '0x$& ')
            $sha512 = [Convert]::ToBase64String($hashBytes)
            $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            $pkg = Get-Content package.json | ConvertFrom-Json
            $ver = $pkg.version

            $lines = @(
              "version: $ver",
              "files:",
              "  - url: PokeBonk.exe",
              "    sha512: $sha512",
              "    size: $size",
              "path: PokeBonk.exe",
              "sha512: $sha512",
              "releaseDate: '$date'"
            )
            $lines -join "`n" | Set-Content "dist/latest.yml" -Encoding UTF8
            Write-Host "Successfully generated dist/latest.yml for v$ver"
          } else {
            Write-Error "dist/PokeBonk.exe not found!"
          }

      - name: Publish Raw EXE to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "PokéBonk Latest Build"
          body: |
            ### Direct Downloads (Android & Windows)
            Download the latest standalone fullscreen builds under **Assets** below:
            * **Android (`PokeBonk.apk`):** Fullscreen landscape + Bluetooth controller support
            * **Windows (`PokeBonk.exe`):** Fast-launch portable fullscreen app with native Xbox (`XInput`) & Nintendo/8BitDo (`Switch HID`) support
              * **`F9`:** Swap `A/B` & `X/Y` button layout
              * **`F11` / `Alt+Enter`:** Toggle Fullscreen / Windowed
              * **`Hold Start + Select (1.5s)`:** Quit game from controller
          files: |
            windows/dist/PokeBonk.exe
            windows/dist/latest.yml
          prerelease: false
          make_latest: true
