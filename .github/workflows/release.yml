name: Automated Build & Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Platform(s) to release'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - windows
          - ios
      bump_type:
        description: 'Version bump level'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

jobs:
  prepare-and-bump:
    runs-on: ubuntu-latest
    outputs:
      build_android: ${{ steps.bump.outputs.build_android }}
      build_windows: ${{ steps.bump.outputs.build_windows }}
      build_ios: ${{ steps.bump.outputs.build_ios }}
      new_sha: ${{ steps.bump.outputs.new_sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Determine Changes & Bump Version
        id: bump
        run: |
          set -e

          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Recent commit: $COMMIT_MSG"

          if [[ "$COMMIT_MSG" == *"[skip ci]"* ]] || [[ "${{ github.actor }}" == "github-actions[bot]" ]]; then
            echo "Skipping automated bump for CI/bot commit."
            echo "build_android=false" >> $GITHUB_OUTPUT
            echo "build_windows=false" >> $GITHUB_OUTPUT
            echo "build_ios=false" >> $GITHUB_OUTPUT
            echo "new_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
            BUMP_TYPE="${{ inputs.bump_type }}"
          else
            BUMP_TYPE="patch"
            if echo "$COMMIT_MSG" | grep -iqE '(\[skip bump\]|bump version)'; then
              echo "Commit indicates manual version bump. Skipping auto-bump."
              BUMP_TYPE="none"
            fi

            BEFORE_SHA="${{ github.event.before }}"
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
              CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" HEAD 2>/dev/null || echo "")
            else
              CHANGED_FILES=""
            fi

            if [ -z "$CHANGED_FILES" ]; then
              CHANGED_FILES=$(git log -m -1 --name-only --pretty="" HEAD 2>/dev/null || echo "")
            fi

            if [ -z "$CHANGED_FILES" ]; then
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            fi

            echo "Changed files:"
            echo "$CHANGED_FILES"

            HAS_ANDROID=false
            HAS_WINDOWS=false
            HAS_IOS=false
            if echo "$CHANGED_FILES" | grep -q '^android/'; then HAS_ANDROID=true; fi
            if echo "$CHANGED_FILES" | grep -q '^windows/'; then HAS_WINDOWS=true; fi
            if echo "$CHANGED_FILES" | grep -q '^ios/'; then HAS_IOS=true; fi
            if echo "$CHANGED_FILES" | grep -q '^core/'; then HAS_ANDROID=true; HAS_WINDOWS=true; HAS_IOS=true; fi
            if echo "$CHANGED_FILES" | grep -q '^scripts/'; then HAS_ANDROID=true; HAS_WINDOWS=true; HAS_IOS=true; fi
            if echo "$CHANGED_FILES" | grep -q '^\.github/workflows/'; then HAS_ANDROID=true; HAS_WINDOWS=true; HAS_IOS=true; fi

            if echo "$COMMIT_MSG" | grep -iqE '(bump version|release)'; then
              if echo "$COMMIT_MSG" | grep -iq 'android'; then HAS_ANDROID=true; fi
              if echo "$COMMIT_MSG" | grep -iq 'windows'; then HAS_WINDOWS=true; fi
              if echo "$COMMIT_MSG" | grep -iq 'ios'; then HAS_IOS=true; fi
              if ! $HAS_ANDROID && ! $HAS_WINDOWS && ! $HAS_IOS; then
                HAS_ANDROID=true
                HAS_WINDOWS=true
                HAS_IOS=true
              fi
            fi

            COUNT=0
            if [ "$HAS_ANDROID" = "true" ]; then COUNT=$((COUNT + 1)); fi
            if [ "$HAS_WINDOWS" = "true" ]; then COUNT=$((COUNT + 1)); fi
            if [ "$HAS_IOS" = "true" ]; then COUNT=$((COUNT + 1)); fi

            if [ $COUNT -gt 1 ] || [ $COUNT -eq 0 ]; then
              TARGET="all"
            elif [ "$HAS_ANDROID" = "true" ]; then
              TARGET="android"
            elif [ "$HAS_WINDOWS" = "true" ]; then
              TARGET="windows"
            elif [ "$HAS_IOS" = "true" ]; then
              TARGET="ios"
            else
              TARGET="all"
            fi
          fi

          echo "Target platform: $TARGET"
          echo "Bump type: $BUMP_TYPE"

          if [ "$TARGET" = "none" ]; then
            echo "No relevant code changes detected."
            echo "build_android=false" >> $GITHUB_OUTPUT
            echo "build_windows=false" >> $GITHUB_OUTPUT
            echo "build_ios=false" >> $GITHUB_OUTPUT
            echo "new_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$BUMP_TYPE" != "none" ]; then
            python3 scripts/bump_version.py --target "$TARGET" --type "$BUMP_TYPE"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add android/app/build.gradle.kts windows/package.json ios/PokeBonk/Resources/Info.plist ios/PokeBonk.xcodeproj/project.pbxproj ios/apps.json 2>/dev/null || true

            if ! git diff --cached --quiet; then
              COMMIT_TEXT="chore(release): auto-bump version ($TARGET $BUMP_TYPE) [skip ci]"
              git commit -m "$COMMIT_TEXT"
              echo "Pushing version bump commit to ${{ github.ref_name }}..."
              PUSH_SUCCESS=false
              if git push origin HEAD:${{ github.ref_name }}; then
                PUSH_SUCCESS=true
              else
                echo "Non-fast-forward push detected. Pulling with rebase..."
                if git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}; then
                  PUSH_SUCCESS=true
                elif git push --force-with-lease origin HEAD:${{ github.ref_name }}; then
                  PUSH_SUCCESS=true
                else
                  echo "::warning::Could not push version bump commit. Reverting to avoid broken ref."
                  git reset --hard ${{ github.sha }}
                fi
              fi
              if [ "$PUSH_SUCCESS" = "true" ]; then
                NEW_SHA=$(git rev-parse HEAD)
              else
                NEW_SHA=${{ github.sha }}
              fi
              echo "Final build commit: $NEW_SHA"
            else
              echo "No version files changed."
              NEW_SHA=${{ github.sha }}
            fi
          else
            NEW_SHA=${{ github.sha }}
          fi

          if [ "$TARGET" = "all" ] || [ "$TARGET" = "android" ]; then
            echo "build_android=true" >> $GITHUB_OUTPUT
          else
            echo "build_android=false" >> $GITHUB_OUTPUT
          fi

          if [ "$TARGET" = "all" ] || [ "$TARGET" = "windows" ]; then
            echo "build_windows=true" >> $GITHUB_OUTPUT
          else
            echo "build_windows=false" >> $GITHUB_OUTPUT
          fi

          if [ "$TARGET" = "all" ] || [ "$TARGET" = "ios" ]; then
            echo "build_ios=true" >> $GITHUB_OUTPUT
          else
            echo "build_ios=false" >> $GITHUB_OUTPUT
          fi

          echo "new_sha=$NEW_SHA" >> $GITHUB_OUTPUT

  build-android:
    needs: prepare-and-bump
    if: needs.prepare-and-bump.outputs.build_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          build-root-directory: android

      - name: Build Optimized Release APK
        working-directory: ./android
        run: gradle assembleRelease --stacktrace

      - name: Rename APK for Clean Download
        run: cp android/app/build/outputs/apk/release/app-release.apk PokeBonk.apk

      - name: Extract Version Info & Create Metadata
        run: |
          VERSION_NAME=$(grep 'versionName =' android/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep 'versionCode =' android/app/build.gradle.kts | head -1 | sed -E 's/.*= *([0-9]+).*/\1/')
          WIN_VERSION=$(grep '"version"' windows/package.json | head -1 | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          cat << EOF > version.json
          {
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "android": {
              "versionName": "$VERSION_NAME",
              "versionCode": $VERSION_CODE
            },
            "windows": {
              "version": "$WIN_VERSION"
            },
            "commit": "${{ github.sha }}",
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Publish Raw APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "PokéBonk Latest Build"
          body: |
            ### Latest Standalone PokéBonk Builds
            Download the latest versions under **Assets** below:
            * **Windows Launcher (`PokeBonk-Launcher.exe`):** Recommended dedicated Riot-style launcher with download progress, file repair, and 1-click launch.
            * **Windows Standalone (`PokeBonk.exe`):** Fast portable desktop client with native controller support and sensitivity settings.
            * **Android (`PokeBonk.apk`):** Direct APK install with native gamepad support and touch controls.
            * **iOS (`PokeBonk.ipa`):** Sideloadable IPA for iPhone and iPad with native gamepad support (install via SideStore, AltStore, Sideloadly, or TrollStore).
          files: |
            PokeBonk.apk
            version.json
          prerelease: false
          make_latest: true

  build-windows:
    needs: prepare-and-bump
    if: needs.prepare-and-bump.outputs.build_windows == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Fast Portable EXE
        working-directory: ./windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm run dist

      - name: Generate Release Metadata (version.json)
        working-directory: ./windows
        shell: pwsh
        run: |
          $exePath = "dist/PokeBonk.exe"
          if (Test-Path $exePath) {
            $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            $pkg = Get-Content package.json | ConvertFrom-Json
            $ver = $pkg.version
            $androidVer = "1.0"
            $androidCode = 1
            if (Test-Path "../android/app/build.gradle.kts") {
              $gradle = Get-Content "../android/app/build.gradle.kts" -Raw
              if ($gradle -match 'versionName\s*=\s*"([^"]+)"') { $androidVer = $matches[1] }
              if ($gradle -match 'versionCode\s*=\s*(\d+)') { $androidCode = [int]$matches[1] }
            }
            $winVerObj = @{
              version = $ver
              versionName = $ver
              windows = @{ version = $ver }
              android = @{ versionName = $androidVer; versionCode = $androidCode }
              timestamp = $date
            }
            $winVerObj | ConvertTo-Json | Set-Content "dist/version.json" -Encoding UTF8
            Write-Host "Successfully generated dist/version.json for v$ver"
          } else {
            Write-Error "dist/PokeBonk.exe not found!"
          }

      - name: Build Dedicated PokéBonk Launcher (Riot-Style Client)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File launcher/build.ps1

      - name: Publish Raw EXE and Launcher to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "PokéBonk Latest Build"
          body: |
            ### Latest Standalone PokéBonk Builds
            Download the latest versions under **Assets** below:
            * **Windows Launcher (`PokeBonk-Launcher.exe`):** Recommended dedicated Riot-style launcher with download progress, file repair, and 1-click launch.
            * **Windows Standalone (`PokeBonk.exe`):** Fast portable desktop client with native controller support and sensitivity settings.
            * **Android (`PokeBonk.apk`):** Direct APK install with native gamepad support and touch controls.
            * **iOS (`PokeBonk.ipa`):** Sideloadable IPA for iPhone and iPad with native gamepad support (install via SideStore, AltStore, Sideloadly, or TrollStore).
          files: |
            windows/dist/PokeBonk-Launcher.exe
            windows/dist/PokeBonk.exe
            windows/dist/version.json
          prerelease: false
          make_latest: true

  build-ios:
    needs: prepare-and-bump
    if: needs.prepare-and-bump.outputs.build_ios == 'true'
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Display Xcode Version
        run: xcodebuild -version

      - name: Build Sideloadable iOS App Bundle
        run: |
          xcodebuild build \
            -project ios/PokeBonk.xcodeproj \
            -scheme PokeBonk \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload into Sideloadable IPA
        run: |
          APP_PATH=$(find build/Build/Products -name "PokeBonk.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: PokeBonk.app not found in build directory!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          codesign --force --deep --sign - "Payload/PokeBonk.app" || true
          zip -qr PokeBonk.ipa Payload
          ls -la PokeBonk.ipa

      - name: Publish Raw IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "PokéBonk Latest Build"
          body: |
            ### Latest Standalone PokéBonk Builds
            Download the latest versions under **Assets** below:
            * **Windows Launcher (`PokeBonk-Launcher.exe`):** Recommended dedicated Riot-style launcher with download progress, file repair, and 1-click launch.
            * **Windows Standalone (`PokeBonk.exe`):** Fast portable desktop client with native controller support and sensitivity settings.
            * **Android (`PokeBonk.apk`):** Direct APK install with native gamepad support and touch controls.
            * **iOS (`PokeBonk.ipa`):** Sideloadable IPA for iPhone and iPad with native gamepad support (install via SideStore, AltStore, Sideloadly, or TrollStore).
          files: |
            PokeBonk.ipa
          prerelease: false
          make_latest: true
