name: Build PokeBonk Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

# Grants GitHub Actions permission to create and update GitHub Releases
permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          build-root-directory: android

      - name: Build Optimized Release APK
        working-directory: ./android
        run: gradle assembleRelease --stacktrace

      - name: Rename APK for Clean Download
        run: cp android/app/build/outputs/apk/release/app-release.apk PokeBonk.apk

      - name: Publish Raw APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "PokéBonk Latest Build"
          body: |
            ### Direct Android Installation
            Tap **`PokeBonk.apk`** under **Assets** below to download and install directly on your Android device (no `.zip` extraction required).
            
            * **Last Built:** Commit `${{ github.sha }}`
          files: PokeBonk.apk
          prerelease: false
          make_latest: true
