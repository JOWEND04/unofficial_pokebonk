<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokéBonk Desktop Client</title>
    <style>
      :root {
        --ink: #2a2440;
        --ink-muted: #9aa4b8;
        --paper: #ffffff;
        --bg-deep: #0e0a20;
        --bg-mid: #171236;
        --bg-top: #261e52;
        --card-bg: rgba(22, 17, 44, 0.65);
        --card-border: rgba(255, 255, 255, 0.12);
        --accent-yellow: #ffcc33;
        --accent-yellow-d: #f2a516;
        --accent-yellow-shadow: #b37400;
        --accent-red: #ff5a5f;
        --accent-orange: #ff9a3a;
        --accent-blue: #3a8cff;
        --accent-green: #36c96a;
        --font: "Nunito", system-ui, -apple-system, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: radial-gradient(circle at 50% 0%, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-deep) 100%);
        color: #ffffff;
        font-family: var(--font);
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 20px;
      }

      .window-container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 22px 24px 20px;
        position: relative;
      }

      /* Title bar drag support */
      .header {
        -webkit-app-region: drag;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: grab;
      }

      .header:active {
        cursor: grabbing;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .pokeball-icon {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: linear-gradient(180deg, var(--accent-red) 48%, #1c1638 48%, #1c1638 52%, #ffffff 52%);
        border: 2px solid #ffffff;
        box-shadow: 0 0 10px rgba(255, 90, 95, 0.45);
        position: relative;
        flex-shrink: 0;
      }

      .pokeball-icon::after {
        content: '';
        position: absolute;
        width: 8px;
        height: 8px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: #ffffff;
        border: 2px solid #1c1638;
      }

      .title-group {
        display: flex;
        flex-direction: column;
      }

      .title-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .brand-title {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 0.02em;
        color: #ffffff;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }

      .badge {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 3px 9px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent-orange), var(--accent-red));
        color: #ffffff;
        box-shadow: 0 2px 6px rgba(255, 90, 95, 0.35);
      }

      .brand-sub {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-muted);
        letter-spacing: 0.02em;
        margin-top: 1px;
      }

      .win-controls {
        -webkit-app-region: no-drag;
        display: flex;
        gap: 6px;
      }

      .win-btn {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.18s ease;
      }

      .win-btn:hover {
        background: rgba(255, 90, 95, 0.85);
        border-color: var(--accent-red);
        color: #ffffff;
      }

      /* Status Display */
      .status-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 14px 16px;
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(12px);
        margin: 14px 0;
        position: relative;
        overflow: hidden;
      }

      .status-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }

      .status-indicator {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent-yellow);
        box-shadow: 0 0 8px var(--accent-yellow);
        flex-shrink: 0;
        transition: background 0.3s, box-shadow 0.3s;
      }

      .status-title {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.02em;
        color: #ffffff;
      }

      .status-desc {
        font-size: 12px;
        color: var(--ink-muted);
        line-height: 1.4;
        margin-left: 20px;
      }

      /* Progress Bar */
      .progress-container {
        display: none;
        width: 100%;
        height: 8px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        margin-top: 10px;
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent-yellow) 0%, var(--accent-yellow-d) 100%);
        border-radius: 10px;
        transition: width 0.25s ease;
      }

      /* Action Buttons */
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      button.btn {
        border: none;
        border-radius: 999px;
        font-family: var(--font);
        font-size: 13.5px;
        font-weight: 800;
        letter-spacing: 0.02em;
        padding: 13px 18px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      button.btn:hover {
        filter: brightness(1.06);
        transform: translateY(-1.5px);
      }

      button.btn:active {
        transform: translateY(1.5px);
      }

      .btn-primary {
        background: linear-gradient(180deg, #ffe066 0%, var(--accent-yellow) 55%, var(--accent-yellow-d) 100%);
        color: var(--ink);
        box-shadow: 0 4px 0 var(--accent-yellow-shadow), 0 6px 18px rgba(242, 165, 22, 0.35);
      }

      .btn-primary:active {
        box-shadow: 0 1px 0 var(--accent-yellow-shadow);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #ffffff;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.3);
      }

      .btn-secondary:active {
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }

      /* Status Styles */
      .state-checking .status-indicator { background: var(--accent-yellow); box-shadow: 0 0 8px var(--accent-yellow); }
      .state-success .status-indicator { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
      .state-downloading .status-indicator { background: var(--accent-blue); box-shadow: 0 0 8px var(--accent-blue); }
      .state-error .status-indicator { background: var(--accent-red); box-shadow: 0 0 8px var(--accent-red); }
    </style>
  </head>
  <body>
    <div class="window-container">
      <div class="header">
        <div class="brand">
          <div class="pokeball-icon"></div>
          <div class="title-group">
            <div class="title-row">
              <div class="brand-title">PokéBonk</div>
              <div class="badge">Desktop</div>
            </div>
            <div class="brand-sub">Native Desktop Launcher</div>
          </div>
        </div>
        <div class="win-controls">
          <div class="win-btn" id="btn-close" title="Close Launcher">&#10005;</div>
        </div>
      </div>

      <div id="status-card" class="status-card state-checking">
        <div class="status-header">
          <div id="indicator" class="status-indicator"></div>
          <div id="status-title" class="status-title">Checking for Updates</div>
        </div>
        <div id="status-desc" class="status-desc">Connecting to the release feed...</div>
        <div id="progress-container" class="progress-container">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>

      <div class="actions">
        <button id="launch" class="btn btn-primary">Launch Game</button>
        <button id="update" class="btn btn-secondary">Check Updates</button>
      </div>
    </div>

    <script>
      const { ipcRenderer } = require('electron');

      const card = document.getElementById('status-card');
      const titleEl = document.getElementById('status-title');
      const descEl = document.getElementById('status-desc');
      const progressContainer = document.getElementById('progress-container');
      const progressBar = document.getElementById('progress-bar');

      let updateReady = false;

      function updateStatus(stateClass, title, description, showProgress = false, percent = 0) {
        card.className = `status-card state-${stateClass}`;
        titleEl.textContent = title;
        descEl.textContent = description;
        if (showProgress) {
          progressContainer.style.display = 'block';
          progressBar.style.width = `${Math.min(100, Math.max(0, percent))}%`;
        } else {
          progressContainer.style.display = 'none';
        }
      }

      ipcRenderer.on('launcher-status', (_, payload = {}) => {
        const status = payload.status || 'checking';
        const msg = payload.message || '';

        switch (status) {
          case 'checking':
            updateStatus('checking', 'Checking for Updates', msg || 'Scanning GitHub for latest builds...');
            break;
          case 'update-available':
            updateStatus('downloading', 'Update Available', `Version ${payload.version || 'new'} found. Downloading...`);
            break;
          case 'downloading':
            const pct = Number(payload.percent || 0);
            updateStatus('downloading', 'Downloading Update', `${pct}% complete. Restart to apply after download.`, true, pct);
            break;
          case 'ready':
            updateReady = true;
            updateStatus('success', 'Update Downloaded', msg || 'Click Restart & Update to apply the latest build.');
            const launchBtn = document.getElementById('launch');
            launchBtn.textContent = 'Restart & Update';
            break;
          case 'up-to-date':
            updateStatus('success', 'Up to Date', msg || 'Your client is running the latest live build.');
            break;
          case 'error':
            updateStatus('error', 'Update Check Notice', msg || 'Unable to query release feed. Ready to play offline.');
            break;
          default:
            updateStatus('checking', 'Ready', msg || 'Ready to start.');
            break;
        }
      });

      document.getElementById('launch').addEventListener('click', () => {
        if (updateReady) {
          ipcRenderer.send('install-update');
        } else {
          ipcRenderer.send('launch-game');
        }
      });

      document.getElementById('update').addEventListener('click', () => {
        ipcRenderer.send('update-game');
      });

      document.getElementById('btn-close').addEventListener('click', () => {
        ipcRenderer.send('exit-launcher');
      });
    </script>
  </body>
</html>
